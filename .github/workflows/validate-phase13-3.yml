name: Validate Phase 13.3

on:
  push:
    branches:
      - phase13-3-gate-expressions
  workflow_dispatch:

jobs:
  phase13_3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install -r apps/api/requirements.txt
      - name: Compile Phase 13.3 canonical and Vercel mirror
        run: |
          python -m py_compile \
            apps/api/app/services/gate_expressions.py \
            apps/web/python_backend/app/services/gate_expressions.py
      - name: Ruff Phase 13.3
        working-directory: apps/api
        run: ruff check app/services/gate_expressions.py tests/test_phase13_3_gate_expressions.py
      - name: Phase 13.3 golden tests
        working-directory: apps/api
        run: pytest -q tests/test_phase13_3_gate_expressions.py
