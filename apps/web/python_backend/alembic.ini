[alembic]
script_location = alembic
prepend_sys_path = %(here)s
# Placeholder only. alembic/env.py overrides this from DATABASE_URL at runtime
# and normalizes the driver to psycopg 3.
sqlalchemy.url = postgresql+psycopg://tinkerlab:tinkerlab@localhost:5432/tinkerlab

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
