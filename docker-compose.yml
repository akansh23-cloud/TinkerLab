services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tinkerlab
      POSTGRES_USER: tinkerlab
      POSTGRES_PASSWORD: tinkerlab
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tinkerlab -d tinkerlab"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - tinkerlab_pg:/var/lib/postgresql/data

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://tinkerlab:tinkerlab@db:5432/tinkerlab
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python -m app.db.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_ORGANISATION_ID: 0b5ec369-282c-57b5-9781-471f818a07c3
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  tinkerlab_pg:
